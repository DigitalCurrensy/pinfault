[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pinfault"
version = "0.1.0"
description = "Void fraction, slope, and lunar offset. Ok is not a clearance to land."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pinfault = "pinfault.__main__:main"
